Define HOSTNAME einsynd.pw
Define HOME_HOST 10.1.1.20

<VirtualHost *:80>
	ProxyPreserveHost On
	ServerName dev.${HOSTNAME}
	ServerAlias sab.${HOSTNAME}
	ServerAlias son.${HOSTNAME}
	ServerAlias del.${HOSTNAME}
	ServerAlias rad.${HOSTNAME}
	ServerAlias got.${HOSTNAME}
	ServerAlias req.${HOSTNAME}
	ServerAlias plex.${HOSTNAME}

	RewriteEngine On
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
	ProxyPass "/" "http://${HOME_HOST}:8080/"
	ProxyPassReverse "/" "http://${HOME_HOST}:8080/"
	ErrorDocument 503 "The default system is down"
</VirtualHost>


<VirtualHost *:443>
	ServerName dev.${HOSTNAME}

    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>

    SSLEngine on
    SSLProxyEngine On

    ProxyPreserveHost Off
    ProxyPass "/""http://${HOME_HOST}:8080/"
    ProxyPassReverse "/""http://${HOME_HOST}:8080/"
    Include /etc/letsencrypt/options-ssl-apache.conf
	ErrorDocument 503 "The experimental system is down"

    SSLCertificateFile /etc/letsencrypt/live/${HOSTNAME}/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${HOSTNAME}/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/${HOSTNAME}/chain.pem
</VirtualHost>

