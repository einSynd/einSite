<VirtualHost *:443>
    ServerName got.${HOSTNAME}
    Keepalive on
	
    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket
    RewriteRule /stream(.*) ws://127.0.0.1:6071/stream$1 [P,L]

    ProxyPreserveHost On
    ProxyPass "/"	"http://127.0.0.1:6071/" retry=0 timeout=5
    ProxyPass "/stream"	"ws://127.0.0.1:6071/stream" retry=0 timeout=60
    ProxyPassReverse "/"	"http://127.0.0.1:6071/"
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorDocument 503 "The gotify is down"

    SSLCertificateFile /etc/letsencrypt/live/got.${HOSTNAME}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/got.${HOSTNAME}/privkey.pem
</VirtualHost>

<virtualHost *:443>
    ServerName  req.${HOSTNAME}
    
    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>

    SSLEngine on
    SSLProxyEngine On

    ProxyPreserveHost Off
    ProxyPass "/" "http://127.0.0.1:5055/"
    ProxyPassReverse "/" "http://127.0.0.1:5055/"
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorDocument 503 "The requests are down"
    
    SSLCertificateFile /etc/letsencrypt/live/req.${HOSTNAME}/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/req.${HOSTNAME}/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/req.${HOSTNAME}/chain.pem
</virtualHost>

<VirtualHost *:443>
    ServerName  plex.${HOSTNAME}
    
    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>
    
    SSLEngine on
    SSLProxyEngine On

    RequestHeader set X-Forwarded-Proto 'https' env=HTTPS
    Header always set Strict-Transport-Security "max-age=15552000; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Robots-Tag none
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self' https:; font-src 'self' data: ${HOME_HOST} plex.${HOSTNAME}; media-src 'self' blob: data: https: ${HOME_HOST} plex.${HOSTNAME} *.plex.direct *.plex.tv plex.tv; script-src 'self' 'unsafe-inline' 'unsafe-eval' ${HOME_HOST} plex.${HOSTNAME} plex.tv *.plex.tv gstatic.com *.gstatic.com *.plex.direct; style-src 'self' ${HOME_HOST} plex.${HOSTNAME} *.plex.direct 'unsafe-inline'; img-src 'self' data: blob: ${HOME_HOST} plex.${HOSTNAME} plex.tv *.plex.tv *.plex.direct; worker-src *; frame-src 'none'; connect-src 'self' wss: https: ${HOME_HOST} plex.${HOSTNAME} plex.tv *.plex.direct *.plex.tv;"
    Header always set Feature-Policy "geolocation 'self'; midi 'self'; sync-xhr 'self'; microphone 'self'; camera 'self'; magnetometer 'self'; gyroscope 'self'; speaker 'self'; fullscreen 'self'; payment 'self'"
	

    ProxyPreserveHost On
    ProxyPass "/" "http://${HOME_HOST}:32400/"
    ProxyPassReverse "/" "http://${HOME_HOST}:32400/"
    
    ProxyPass "/:/" "ws://${HOME_HOST}:32400/:/"
	ProxyPassReverse "/:/" "ws://${HOME_HOST}:32400/:/"
	
	ProxyPass "/:/" "wss://${HOME_HOST}:32400/:/"
	ProxyPassReverse "/:/" "wss://${HOME_HOST}:32400/:/"
	
	<Location /:/websockets/notifications>
		ProxyPass wss://${HOME_HOST}:32400/:/websockets/notifications
		ProxyPassReverse wss://$${HOME_HOST}:32400/:/websockets/notifications
	</Location>
	
	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/web
	RewriteCond %{HTTP:X-Plex-Device} ^$
	RewriteCond %{REQUEST_METHOD} !^(OPTIONS)$
	RewriteCond %{QUERY_STRING} (^|&)X-Plex-Device=(&|$) [OR]
	RewriteCond %{QUERY_STRING} !(^|&)X-Plex-Device=
	RewriteRule ^/$ /web/$1 [R,L]
	
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorDocument 503 "The plexes are down"
    
    SSLCertificateFile /etc/letsencrypt/live/plex.${HOSTNAME}/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/plex.${HOSTNAME}/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/plex.${HOSTNAME}/chain.pem
</VirtualHost>